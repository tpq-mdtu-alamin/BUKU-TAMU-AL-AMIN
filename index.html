<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Buku Tamu AL AMIN</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6f5;
  color:#263238;
}

.header{
  background:#075f45;
  color:white;
  padding:35px 20px 65px;
  text-align:center;
}

.header h1{
  margin:0 0 7px;
  font-size:27px;
}

.header p{
  margin:0;
  opacity:.9;
}

.card{
  width:calc(100% - 28px);
  max-width:560px;
  margin:-35px auto 30px;
  background:white;
  border-radius:18px;
  padding:24px 20px;
  box-shadow:0 8px 30px rgba(0,0,0,.1);
}

.title{
  color:#075f45;
  font-size:18px;
  font-weight:bold;
  margin-bottom:5px;
}

.desc{
  font-size:13px;
  color:#777;
  margin-bottom:23px;
}

.group{
  margin-bottom:17px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.req{
  color:red;
}

input,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #d5d9d7;
  border-radius:10px;
  font-size:14px;
  outline:none;
}

textarea{
  min-height:85px;
  resize:vertical;
}

input:focus,
textarea:focus{
  border-color:#075f45;
}

.pilihan{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.pilihan input{
  display:none;
}

.pilihan label{
  text-align:center;
  padding:17px 10px;
  border:2px solid #ddd;
  border-radius:11px;
  cursor:pointer;
  margin:0;
}

.pilihan input:checked + label{
  border-color:#075f45;
  background:#edf8f4;
  color:#075f45;
}

button{
  width:100%;
  border:0;
  background:#075f45;
  color:white;
  padding:14px;
  border-radius:11px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

#error{
  display:none;
  margin-top:13px;
  background:#fff1f1;
  color:#b42318;
  padding:11px;
  border-radius:8px;
  font-size:13px;
}

#success{
  display:none;
  text-align:center;
  padding:35px 10px;
}

.check{
  width:75px;
  height:75px;
  margin:auto;
  background:#e7f7f0;
  color:#075f45;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
}

#success h2{
  color:#075f45;
}

iframe{
  display:none;
}
</style>
</head>

<body>

<div class="header">
  <h1>Buku Tamu</h1>
  <p>TPQ & MDTU AL AMIN</p>
</div>

<div class="card">

<div id="formArea">

  <div class="title">Selamat Datang</div>

  <div class="desc">
    Silakan isi data kunjungan Anda.
  </div>

  <form
    id="formTamu"
    method="POST"
    target="hiddenFrame"
    action="https://script.google.com/a/~/macros/s/AKfycbzlfwr_kOB7zTQFvQm_RjtLuA1bAUzMkWBnR3r6fuuYhqQPa78ejPULq7wMxpUsWBHU/exec"
  >

    <div class="group">

      <label>
        Tujuan Lembaga
        <span class="req">*</span>
      </label>

      <div class="pilihan">

        <div>
          <input
            type="radio"
            name="lembaga"
            value="TPQ"
            id="tpq"
            required
          >
          <label for="tpq">TPQ</label>
        </div>

        <div>
          <input
            type="radio"
            name="lembaga"
            value="MDTU"
            id="mdtu"
            required
          >
          <label for="mdtu">MDTU</label>
        </div>

      </div>

    </div>


    <div class="group">
      <label>
        Nama Lengkap
        <span class="req">*</span>
      </label>

      <input
        name="nama"
        required
        placeholder="Masukkan nama lengkap"
      >
    </div>


    <div class="group">
      <label>
        Asal / Instansi
        <span class="req">*</span>
      </label>

      <input
        name="asal"
        required
        placeholder="Asal atau instansi"
      >
    </div>


    <div class="group">
      <label>Nomor WhatsApp</label>

      <input
        name="whatsapp"
        inputmode="numeric"
        placeholder="08xxxxxxxxxx"
      >
    </div>


    <div class="group">
      <label>
        Keperluan
        <span class="req">*</span>
      </label>

      <textarea
        name="keperluan"
        required
        placeholder="Tuliskan keperluan kunjungan"
      ></textarea>
    </div>


    <div class="group">
      <label>Bertemu Dengan</label>

      <input
        name="bertemu"
        placeholder="Nama ustadz / ustadzah / pengurus"
      >
    </div>


    <div class="group">
      <label>Keterangan</label>

      <textarea
        name="keterangan"
        placeholder="Keterangan tambahan"
      ></textarea>
    </div>


    <button id="btn" type="submit">
      Kirim Buku Tamu
    </button>

  </form>

  <div id="error"></div>

</div>


<div id="success">

  <div class="check">✓</div>

  <h2>Terima Kasih</h2>

  <p>
    Data kunjungan Anda telah tercatat
    di Buku Tamu TPQ & MDTU AL AMIN.
  </p>

</div>

</div>


<iframe
  name="hiddenFrame"
  id="hiddenFrame"
></iframe>


<script>

const form =
  document.getElementById('formTamu');

const btn =
  document.getElementById('btn');

let sedangKirim = false;


form.addEventListener('submit', function(){

  sedangKirim = true;

  btn.disabled = true;
  btn.textContent = 'Menyimpan...';

});


document
.getElementById('hiddenFrame')
.addEventListener('load', function(){

  if(!sedangKirim) return;

  sedangKirim = false;

  document
    .getElementById('formArea')
    .style.display = 'none';

  document
    .getElementById('success')
    .style.display = 'block';

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

});

</script>

</body>
</html>
